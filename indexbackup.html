<!DOCTYPE html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --panel-alt: #eef3ff;
        --primary: #5b7cff;
        --primary-dark: #405ee6;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f3;
        --danger: #ef4444;
        --success: #22c55e;
        --shadow: 0 18px 40px rgba(42, 58, 99, 0.12);
      }

      body.dark {
        --bg: #111827;
        --panel: #1f2937;
        --panel-alt: #0f172a;
        --primary: #8aa4ff;
        --primary-dark: #728dfa;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #374151;
        --danger: #f87171;
        --success: #4ade80;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        transition: background 0.25s ease, color 0.25s ease;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .app {
        width: min(92vw, 520px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px 24px 20px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
      }

      .theme-toggle {
        border: none;
        background: var(--panel-alt);
        color: var(--text);
        width: 48px;
        height: 48px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 1.2rem;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .theme-toggle:hover {
        transform: translateY(-1px);
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      input[type="text"] {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(91, 124, 255, 0.15);
      }

      button.add-btn {
        border: none;
        background: var(--primary);
        color: white;
        border-radius: 12px;
        padding: 0 18px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button.add-btn:hover {
        background: var(--primary-dark);
      }

      .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        margin-bottom: 14px;
      }

      .stats strong {
        color: var(--text);
      }

      .todo-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .todo-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 12px 12px 14px;
      }

      .todo-main {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }

      .todo-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      .todo-text {
        flex: 1;
        word-break: break-word;
        font-size: 1rem;
      }

      .todo-item.completed .todo-text {
        text-decoration: line-through;
        color: var(--muted);
      }

      .delete-btn {
        border: none;
        background: transparent;
        color: var(--danger);
        font-size: 1.15rem;
        cursor: pointer;
        padding: 6px 8px;
        border-radius: 8px;
      }

      .delete-btn:hover {
        background: rgba(239, 68, 68, 0.08);
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 18px 10px 8px;
      }

      @media (max-width: 420px) {
        .app {
          padding: 20px 14px 16px;
        }

        .input-row {
          flex-direction: column;
        }

        button.add-btn {
          height: 46px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Todo List</h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
      </header>

      <div class="input-row">
        <input id="todoInput" type="text" placeholder="Add a new task..." maxlength="120" />
        <button class="add-btn" id="addBtn">Add</button>
      </div>

      <div class="stats">
        <span><strong id="remainingCount">0</strong> remaining</span>
        <span id="totalCount">0 tasks</span>
      </div>

      <ul class="todo-list" id="todoList"></ul>
      <div class="empty" id="emptyState" hidden>No tasks yet. Add one above.</div>
    </main>

    <script>
      <!-- dsadsadsadsa--- -->

      const todoInput = document.getElementById('todoInput');
      const addBtn = document.getElementById('addBtn');
      const todoList = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');
      const remainingCount = document.getElementById('remainingCount');
      const totalCount = document.getElementById('totalCount');
      const themeToggle = document.getElementById('themeToggle');

      let todos = [
        { id: 1, text: 'Plan the day', completed: false },
        { id: 2, text: 'Finish a small task', completed: true }
      ];

      function renderTodos() {
        todoList.innerHTML = '';

        if (todos.length === 0) {
          emptyState.hidden = false;
        } else {
          emptyState.hidden = true;
        }

        const remaining = todos.filter(todo => !todo.completed).length;
        remainingCount.textContent = remaining;
        totalCount.textContent = `${todos.length} task${todos.length === 1 ? '' : 's'}`;

        todos.forEach(todo => {
          const item = document.createElement('li');
          item.className = `todo-item${todo.completed ? ' completed' : ''}`;

          const main = document.createElement('div');
          main.className = 'todo-main';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = todo.completed;
          checkbox.setAttribute('aria-label', `Mark ${todo.text} complete`);
          checkbox.addEventListener('change', () => {
            todo.completed = checkbox.checked;
            renderTodos();
          });

          const text = document.createElement('span');
          text.className = 'todo-text';
          text.textContent = todo.text;

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = '✕';
          deleteBtn.setAttribute('aria-label', `Delete ${todo.text}`);
          deleteBtn.addEventListener('click', () => {
            todos = todos.filter(entry => entry.id !== todo.id);
            renderTodos();
          });

          main.appendChild(checkbox);
          main.appendChild(text);
          item.appendChild(main);
          item.appendChild(deleteBtn);
          todoList.appendChild(item);
        });
      }

      function addTodo() {
        const value = todoInput.value.trim();
        if (!value) return;

        todos.push({
          id: Date.now() + Math.random(),
          text: value,
          completed: false
        });

        todoInput.value = '';
        todoInput.focus();
        renderTodos();
      }

      addBtn.addEventListener('click', addTodo);
      todoInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') addTodo();
      });

      function applyTheme(isDark) {
        document.body.classList.toggle('dark', isDark);
        themeToggle.textContent = isDark ? '☀️' : '🌙';
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      }

      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialDark = savedTheme ? savedTheme === 'dark' : prefersDark;
      applyTheme(initialDark);

      themeToggle.addEventListener('click', () => {
        const isDark = !document.body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        applyTheme(isDark);
      });

      renderTodos();
    </script>
  </body>
</html>
